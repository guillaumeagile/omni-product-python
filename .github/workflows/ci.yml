name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Compilation, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest

  mutation:
    name: Mutation testing (modèle)
    runs-on: ubuntu-latest
    # Informatif : le score n'est pas bloquant tant que les tests du modèle sont incomplets.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run mutmut run
      - run: uv run mutmut results
