name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Compilation, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest

  mutation:
    name: Mutation testing (modèle)
    runs-on: ubuntu-latest
    # Informatif : le score n'est pas bloquant tant que les tests du modèle sont incomplets.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run mutmut run
      - run: uv run mutmut results
      - name: Exporter les statistiques de mutation
        if: always()
        run: uv run mutmut export-cicd-stats
      - name: Publier les statistiques pour la scorecard
        # Sur main, elles servent de base aux PR suivantes (badge 🧬 Tueur de mutants).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-stats
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: ignore
      - name: Résumé dans le job
        if: always()
        run: |
          uv run python scripts/mutation_report.py mutants/mutmut-cicd-stats.json > mutation-report.md
          cat mutation-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publier le résumé en commentaire de PR
        # Un commentaire existant est mis à jour pour ne pas polluer la PR à chaque push.
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | startswith("<!-- mutation-report -->")) | .id' | sed -n '1p')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@mutation-report.md
          else
            gh pr comment "$PR_NUMBER" --body-file mutation-report.md
          fi

  scorecard:
    name: Scorecard (harnais)
    runs-on: ubuntu-latest
    # Le score de mutation de la PR vient du job de mutation : la scorecard l'attend.
    needs: mutation
    if: ${{ !cancelled() }}
    # Informatif : la scorecard guide le refactoring, elle ne bloque jamais une PR.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # La base de la PR doit être disponible pour comparer avant / après.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Récupérer le score de mutation de la PR
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mutation-stats
          path: mutation-head
      - name: Récupérer le score de mutation de la base (dernier passage réussi sur main)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          run_id=$(gh run list --workflow ci.yml --branch "$BASE_BRANCH" --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name mutation-stats --dir mutation-base
          fi
      - name: Calculer la scorecard
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          uv run python -m harness.scorecard ${BASE_REF:+--base-ref "$BASE_REF"} \
            --mutation-stats mutation-head/mutmut-cicd-stats.json \
            --base-mutation-stats mutation-base/mutmut-cicd-stats.json \
            --output scorecard.md
          cat scorecard.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publier la scorecard en commentaire de PR
        # Un commentaire existant est mis à jour pour ne pas polluer la PR à chaque push.
        # Les PR venant d'un fork n'ont pas le droit d'écrire : le résumé du job suffit alors.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | startswith("<!-- harness-scorecard -->")) | .id' | sed -n '1p')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@scorecard.md
          else
            gh pr comment "$PR_NUMBER" --body-file scorecard.md
          fi

  classement:
    name: Classement des équipes
    runs-on: ubuntu-latest
    # Le classement lit le total de la scorecard de chaque PR d'équipe ouverte : il passe après elle.
    # La convention de branche `<equipe>/regle-<N>-<slug>` désigne l'équipe (voir README, « Le jeu »).
    needs: scorecard
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    # Informatif : le classement ne bloque jamais une PR.
    continue-on-error: true
    # Une seule mise à jour à la fois : chaque passage relit toutes les PR, le dernier écrit l'état complet.
    concurrency:
      group: classement-cupid
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Publier le classement dans l'issue épinglée
        env:
          GH_TOKEN: ${{ github.token }}
          TITRE: Classement de l'atelier CUPID
        run: |
          gh pr list --state open --limit 1000 --json number,title,headRefName,comments > prs.json
          python3 scripts/classement.py prs.json > classement.md
          cat classement.md >> "$GITHUB_STEP_SUMMARY"
          numero=$(gh issue list --state open --search "in:title Classement CUPID" --limit 100 \
            --json number,title --jq 'map(select(.title == env.TITRE)) | .[0].number // empty')
          if [ -z "$numero" ]; then
            url=$(gh issue create --title "$TITRE" --body-file classement.md)
            gh issue pin "$url" || echo "::warning::issue du classement non épinglée"
          else
            gh issue edit "$numero" --body-file classement.md
          fi
