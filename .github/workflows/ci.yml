name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Compilation, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest

  mutation:
    name: Mutation testing (modèle)
    runs-on: ubuntu-latest
    # Informatif : le score n'est pas bloquant tant que les tests du modèle sont incomplets.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run mutmut run
      - run: uv run mutmut results
      - name: Exporter les statistiques de mutation
        if: always()
        run: uv run mutmut export-cicd-stats
      - name: Résumé dans le job
        if: always()
        run: |
          uv run python scripts/mutation_report.py mutants/mutmut-cicd-stats.json > mutation-report.md
          cat mutation-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publier le résumé en commentaire de PR
        # Un commentaire existant est mis à jour pour ne pas polluer la PR à chaque push.
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | startswith("<!-- mutation-report -->")) | .id' | sed -n '1p')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@mutation-report.md
          else
            gh pr comment "$PR_NUMBER" --body-file mutation-report.md
          fi
